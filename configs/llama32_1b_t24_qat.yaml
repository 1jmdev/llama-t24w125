model:
  name_or_path: meta-llama/Llama-3.2-1B
  revision: main
  trust_remote_code: false
  dtype: bf16
  gradient_checkpointing: true
  torch_compile: false

quant:
  scale_group_size: 128
  scale_dtype: float16
  skip_names:
    - lm_head
    - embed_tokens

data:
  dataset_name: HuggingFaceFW/fineweb
  dataset_config: sample-10BT
  split: train
  text_column: text
  output_dir: data/fineweb_10gb
  max_raw_gb: 10
  seq_len: 2048
  token_dtype: uint32
  num_proc: 8
  streaming: true

train:
  output_dir: outputs/llama32_1b_t24_qat
  seed: 1337
  max_steps: 10000
  warmup_steps: 20
  batch_size: 1
  grad_accum_steps: 16
  learning_rate_muon: 0.006
  learning_rate_adamw: 2.0e-5
  weight_decay: 0.01
  muon_momentum: 0.95
  muon_ns_steps: 5
  max_grad_norm: 1.0
  quant_warmup_steps: 4000
  quant_start_alpha: 0.0
  quant_end_alpha: 1.0
  save_every: 500
  eval_every: 250
  eval_batches: 64
  num_workers: 2
  shuffle_buffer: 2048
  log_every: 10

export:
  packed_dir: outputs/llama32_1b_t24_packed
