model:
  name_or_path: meta-llama/Llama-3.2-1B
  revision: main
  trust_remote_code: false
  dtype: bf16
  gradient_checkpointing: true
  torch_compile: false

quant:
  scale_group_size: 128
  scale_dtype: float16
  skip_names:
    - lm_head
    - embed_tokens

# Dataset defaults point at the public Ultra-FineWeb repo. Some mirrors/configs may require accepting HF terms.
data:
  dataset_name: openbmb/Ultra-FineWeb
  dataset_config: null
  split: train
  text_column: text
  output_dir: data/ultrafineweb_llama32_10gb
  max_raw_gb: 10
  seq_len: 2048
  token_dtype: uint32
  num_proc: 8
  streaming: true

train:
  output_dir: outputs/llama32_1b_t24_qat
  seed: 1337
  max_steps: 2000
  warmup_steps: 100
  batch_size: 1
  grad_accum_steps: 16
  learning_rate_muon: 0.015
  learning_rate_adamw: 2.0e-5
  weight_decay: 0.01
  muon_momentum: 0.95
  muon_ns_steps: 5
  max_grad_norm: 1.0
  save_every: 500
  eval_every: 250
  eval_batches: 64
  num_workers: 2
  shuffle_buffer: 2048
  log_every: 10

export:
  packed_dir: outputs/llama32_1b_t24_packed
